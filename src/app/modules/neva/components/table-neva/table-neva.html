<table class="table table-striped border table-neva">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Rol</th>
      <th>Estación</th>
      <th>Facción</th>
      <th>Habilidad</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let character of characters">
      <td>{{ character.name }}</td>
      <td>{{ character.role }}</td>
      <td>{{ character.season }}</td>
      <td>
        <span class="badge" [class]="'badge ' + getFactionClass(character.faction)">
          {{ character.faction }}
        </span>
      </td>
      <td>{{ character.ability }}</td>
    </tr>
  </tbody>
</table>
